<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Masuk - Tool Room Management</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-add {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add:hover {
            background: #d97706;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 450px;
            max-width: 90%;
            padding: 25px;
            border-radius: 10px;
            color: #333;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit; display: block;">
                <div>
                    <span>TOOL ROOM</span>
                    <small>PT INTI UTAMA PERKASA</small>
                </div>
            </a>
        </div>

        <nav>

            <a href="index.html">
                🏠 Dashboard
            </a>

            <a href="master-alat.html">
                🧰 Master Alat
            </a>

            <a href="stock-masuk.html" class="active">
                📦 Stock Masuk
            </a>

            <a href="peminjaman.html">
                👤 Peminjaman
            </a>

            <a href="pengembalian.html">
                ↩️ Pengembalian
            </a>

            <a href="stock-opname.html">
                📋 Stock Opname
            </a>

            <a href="berita-acara.html">
                📄 Berita Acara
            </a>

        </nav>

        <div class="user">
            👷<br>
            <strong>TOOLMAN</strong>
        </div>

    </aside>


    <!-- KONTEN UTAMA -->
    <main class="content">

        <!-- HEADER -->
        <header class="topbar">

            <h1>STOCK MASUK</h1>

            <p>
                Catat alat yang masuk ke Tool Room
            </p>

        </header>


        <!-- DASHBOARD / KONTEN UTAMA -->
        <section class="dashboard">

            <div class="page-header">
                <h2>📦 Data Stock Masuk</h2>

                <button class="btn-add" onclick="openModal()">
                    + Stock Masuk
                </button>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Kode Alat</th>
                            <th>Nama Alat</th>
                            <th>Jumlah</th>
                            <th>Supplier</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="stockTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- MODAL -->

    <div class="modal" id="stockModal">

        <div class="modal-content">

            <h2>Tambah Stock Masuk</h2>

            <div class="form-group">
                <label>Tanggal Masuk</label>
                <input type="date" id="tanggal">
            </div>

            <div class="form-group">
                <label>Pilih Alat</label>

                <select id="alat">
                    <option value="">-- Pilih Alat --</option>
                </select>

            </div>

            <div class="form-group">
                <label>Jumlah Masuk</label>
                <input type="number" id="jumlah" min="1">
            </div>

            <div class="form-group">
                <label>Supplier</label>
                <input type="text" id="supplier" placeholder="Nama supplier">
            </div>

            <div class="form-group">
                <label>Keterangan</label>
                <textarea id="keterangan" rows="3"></textarea>
            </div>

            <div class="form-actions">

                <button class="btn-cancel" onclick="closeModal()">
                    Batal
                </button>

                <button class="btn-add" onclick="simpanStock()">
                    Simpan
                </button>

            </div>

        </div>

    </div>


    <script>

    let dataStock = JSON.parse(localStorage.getItem("dataStockMasuk")) || [];
    let dataAlat = JSON.parse(localStorage.getItem("dataAlat")) || [];

    // TAMPILKAN ALAT DARI MASTER ALAT
    function loadAlat() {
        const select = document.getElementById("alat");
        select.innerHTML = '<option value="">-- Pilih Alat --</option>';

        dataAlat.forEach(function(alat) {
            select.innerHTML += `
                <option value="${alat.kode}">
                    ${alat.kode} - ${alat.nama}
                </option>
            `;
        });
    }

    // TAMPILKAN DATA STOCK
    function tampilkanData() {
        const table = document.getElementById("stockTable");
        table.innerHTML = "";

        dataStock.forEach(function(data, index) {
            table.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${data.tanggal}</td>
                    <td>${data.kode}</td>
                    <td>${data.nama}</td>
                    <td>${data.jumlah}</td>
                    <td>${data.supplier}</td>
                    <td>${data.keterangan}</td>
                    <td>
                        <button class="btn-delete" onclick="hapusStock(${index})">
                            Hapus
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    // BUKA MODAL
    function openModal() {
        document.getElementById("stockModal").style.display = "flex";
        document.getElementById("tanggal").value = new Date().toISOString().split("T")[0];
    }

    // TUTUP MODAL
    function closeModal() {
        document.getElementById("stockModal").style.display = "none";
    }

    // SIMPAN STOCK
    function simpanStock() {
        const tanggal = document.getElementById("tanggal").value;
        const kode = document.getElementById("alat").value;
        const jumlah = Number(document.getElementById("jumlah").value);
        const supplier = document.getElementById("supplier").value;
        const keterangan = document.getElementById("keterangan").value;

        if (!tanggal || !kode || jumlah <= 0) {
            alert("Tanggal, alat, dan jumlah wajib diisi!");
            return;
        }

        const alat = dataAlat.find(function(item) {
            return item.kode === kode;
        });

        if (!alat) {
            alert("Alat tidak ditemukan!");
            return;
        }

        // TAMBAH STOCK KE MASTER ALAT
        alat.stok = Number(alat.stok) + jumlah;

        localStorage.setItem("dataAlat", JSON.stringify(dataAlat));

        // SIMPAN TRANSAKSI
        dataStock.push({
            tanggal: tanggal,
            kode: alat.kode,
            nama: alat.nama,
            jumlah: jumlah,
            supplier: supplier,
            keterangan: keterangan
        });

        localStorage.setItem("dataStockMasuk", JSON.stringify(dataStock));

        alert("Stock berhasil ditambahkan!");
        closeModal();
        tampilkanData();

        document.getElementById("jumlah").value = "";
        document.getElementById("supplier").value = "";
        document.getElementById("keterangan").value = "";
    }

    // HAPUS STOCK
    function hapusStock(index) {
        if (!confirm("Yakin ingin menghapus transaksi ini?")) {
            return;
        }

        const data = dataStock[index];

        // KEMBALIKAN STOCK MASTER
        const alat = dataAlat.find(function(item) {
            return item.kode === data.kode;
        });

        if (alat) {
            alat.stok = Math.max(0, Number(alat.stok) - Number(data.jumlah));
            localStorage.setItem("dataAlat", JSON.stringify(dataAlat));
        }

        // HAPUS TRANSAKSI
        dataStock.splice(index, 1);
        localStorage.setItem("dataStockMasuk", JSON.stringify(dataStock));

        tampilkanData();
    }

    // JALANKAN
    loadAlat();
    tampilkanData();

    </script>

</body>
</html>
